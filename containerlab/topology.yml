name: demo_containerlab

mgmt:
  network: srlabo-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    node1:
      kind: linux
      image: alpine:latest
      mgmt-ipv4: 172.20.20.111
      exec:
        - apk add --no-cache openssh
        - ssh-keygen -A
        - sh -c "echo 'root:admin' | chpasswd"
        - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
        - /usr/sbin/sshd

    node2:
      kind: linux
      image: alpine:latest
      mgmt-ipv4: 172.20.20.122
      exec:
        - apk add --no-cache openssh
        - ssh-keygen -A
        - sh -c "echo 'root:admin' | chpasswd"
        - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
        - /usr/sbin/sshd

  links:
    - endpoints: ["node1:eth1", "node2:eth1"]
